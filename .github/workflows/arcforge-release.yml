# Arc Forge build of this fork: a linux_amd64 tarball made by CI from the
# pushed commit, for prod-forge-gateway (arcforgelabs/platform versions.yaml pins
# its URL and sha256). Each push to an arcforge/* branch makes the release
# arcforge-<short commit>; the tag is made by the release, at that commit.
name: arcforge-release

on:
  push:
    branches: ["arcforge/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/providers/linode/
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          TAG="arcforge-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          version="0.80.0-${TAG}"
          go build -trimpath -o dist/crabbox \
            -ldflags "-s -w -X github.com/openclaw/crabbox/internal/cli.version=${version} -X github.com/openclaw/crabbox/internal/runtimeartifact.distribution=complete" \
            ./cmd/crabbox
          tar -C dist -czf "crabbox_${TAG}_linux_amd64.tar.gz" crabbox
          sha256sum "crabbox_${TAG}_linux_amd64.tar.gz" > "crabbox_${TAG}_linux_amd64.tar.gz.sha256"
          cat "crabbox_${TAG}_linux_amd64.tar.gz.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" \
            --notes "Arc Forge build of ${GITHUB_SHA}: stock v0.80.0 plus gzip Linode user data." \
            "crabbox_${TAG}_linux_amd64.tar.gz" "crabbox_${TAG}_linux_amd64.tar.gz.sha256"
